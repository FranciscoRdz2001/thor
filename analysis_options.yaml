# Lints estrictos para todo el workspace — very_good_analysis es el estándar
# de facto para paquetes publicables; se hereda en cada paquete.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Los docs públicos son parte del contrato del SDK.
    public_member_api_docs: true
